name: Build and release CommBox
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to build and publish
        type: choice
        options:
          - windows
          - windows-android
          - all
        default: windows
      publish:
        description: Publish a release after all platform builds and tests pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: commbox-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scope == 'all' && '[{"runner":"windows-2025","platform":"windows-amd64"},{"runner":"macos-15","platform":"darwin-arm64"},{"runner":"macos-15-intel","platform":"darwin-amd64"},{"runner":"ubuntu-24.04","platform":"linux-amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]' || '[{"runner":"windows-2025","platform":"windows-amd64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 -timeout=5m ./...
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: |
          $version = [regex]::Match((Get-Content core/modes.go -Raw), 'const Version = "([^"]+)"').Groups[1].Value
          if ($env:RELEASE_PUBLISH -eq 'true') {
            $tag = 'v' + $version
            git rev-parse --verify --quiet ($tag + '^{}') > $null
            if ($LASTEXITCODE -ne 0) { git tag $tag }
            ./scripts/build-release.ps1
          } else {
            ./scripts/build-release.ps1 -SkipTagCheck
          }
          New-Item -ItemType Directory -Force build/release | Out-Null
          Copy-Item "build/CommBox-$version-Windows-x64.zip" build/release/
          # 完整 7z 与只含主程序的 GUI.zip / GUI.7z,逐文件核对 SHA256
          ./scripts/compress-windows.ps1 -SourceArchive "build/release/CommBox-$version-Windows-x64.zip"
      - name: Build macOS or Linux
        if: runner.os != 'Windows'
        run: bash scripts/build-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
  android:
    if: inputs.scope == 'all' || inputs.scope == 'windows-android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and build debug APK
        run: |
          gradle -p apps/android :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: commbox-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare signed release keystore
        if: inputs.publish
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing Android release signing secrets"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing Android keystore password or alias secrets"; exit 1; }
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: inputs.publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' core/modes.go)
          version_code=$(git rev-list --count HEAD)
          gradle -p apps/android :app:assembleRelease -PreleaseVersion="$version" -PreleaseVersionCode="$version_code"
          apk=$(find apps/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          app_id=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$apk")
          test "$app_id" = "com.xiaoleng.commbox"
          mkdir -p build/release
          cp "$apk" "build/release/CommBox-$version-Android.apk"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: release-android
          path: build/release/CommBox-*-Android.apk
          if-no-files-found: error
  release:
    if: ${{ always() && inputs.publish && needs.build.result == 'success' && (inputs.scope == 'windows' || needs.android.result == 'success') }}
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' core/modes.go)
          tag="v$version"
          test -n "$version"
          cp docs/CommBox使用手册.md build/release/CommBox-Manual.md
          for asset in "CommBox-$version-Windows-x64.zip" "CommBox-$version-Windows-x64.7z" "CommBox-$version-Windows-x64-GUI.zip" "CommBox-$version-Windows-x64-GUI.7z" CommBox-Manual.md; do
            test -s "build/release/$asset" || { echo "Missing release asset: $asset"; exit 1; }
          done
          if [[ "$RELEASE_SCOPE" == all ]]; then
            for asset in "CommBox-$version-macOS-AppleSilicon.dmg" "CommBox-$version-macOS-Intel.dmg" commbox-linux-amd64 commbox-linux-arm64 "CommBox-$version-Linux-amd64.tar.gz" "CommBox-$version-Linux-arm64.tar.gz"; do
              test -s "build/release/$asset"
            done
          fi
          if [[ "$RELEASE_SCOPE" == all || "$RELEASE_SCOPE" == windows-android ]]; then
            test -s "build/release/CommBox-$version-Android.apk"
          fi
          (cd build/release && sha256sum * > SHA256SUMS.txt)
          cp "docs/releases/release-$tag.md" build/release-notes.md
          printf '\n## SHA256\n\n```text\n' >> build/release-notes.md
          cat build/release/SHA256SUMS.txt >> build/release-notes.md
          printf '```\n' >> build/release-notes.md
          # 标题取发布说明第一行:"# CommBox v0.11.3 — 软件内更新" → "CommBox v0.11.3 · 软件内更新"
          title=$(head -n 1 "docs/releases/release-$tag.md" | sed 's/^# *//; s/ — / · /')
          case "$title" in "CommBox $tag"*) ;; *) echo "发布说明第一行应以 '# CommBox $tag' 开头: $title"; exit 1 ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$title" --notes-file build/release-notes.md build/release/*
          gh release edit "$tag" --draft=false --latest
