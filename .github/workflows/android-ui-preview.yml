name: Android UI preview
on:
  push:
    tags:
      - v0.11.8-android-ui
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and build debug APK
        run: gradle -p apps/android :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"
      - name: Build and verify signed preview APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p apps/android :app:assembleRelease -PreleaseVersion=0.11.8 -PreleaseVersionCode=142
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          grep -q 'da9e5afe2215dd344fb3575d1dd52d2959eb6081a89e81948fac4a312fec210d' "$RUNNER_TEMP/apk-signature.txt"
          badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk")
          grep -q "package: name='com.xiaoleng.commbox' versionCode='142' versionName='0.11.8'" <<< "$badging"
          mkdir -p build/release
          cp "$apk" build/release/CommBox-0.11.8-Android.apk
          (cd build/release && sha256sum CommBox-0.11.8-Android.apk > SHA256SUMS-Android.txt)
          sed '/^## SHA256/,$d' docs/releases/android-ui-v0.11.8.md > build/release-notes.md
          printf '\n## SHA256\n\n```text\n' >> build/release-notes.md
          cat build/release/SHA256SUMS-Android.txt >> build/release-notes.md
          printf '```\n' >> build/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: commbox-android-ui-preview
          path: build/release/*
          if-no-files-found: error
      - name: Publish Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --prerelease --title 'CommBox Android 中文界面预览 v0.11.8' --notes-file build/release-notes.md build/release/*
