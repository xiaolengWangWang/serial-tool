name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      source_run_id:
        description: Completed build run with release artifacts
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          test "$tag_sha" = "$source_sha"
          version=${RELEASE_TAG#v}
          test "$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' core/modes.go)" = "$version"
          cp docs/CommBox使用手册.md build/release/CommBox-Manual.md
          for asset in "CommBox-$version-Windows-x64.zip" "CommBox-$version-Windows-x64.7z" "CommBox-$version-Windows-x64-GUI.zip" "CommBox-$version-Windows-x64-GUI.7z" "CommBox-$version-Android.apk" CommBox-Manual.md; do
            test -s "build/release/$asset" || { echo "Missing release asset: $asset"; exit 1; }
          done
          (cd build/release && sha256sum * > SHA256SUMS.txt)
          cp "docs/releases/release-$RELEASE_TAG.md" build/release-notes.md
          printf '\n## SHA256\n\n```text\n' >> build/release-notes.md
          cat build/release/SHA256SUMS.txt >> build/release-notes.md
          printf '```\n' >> build/release-notes.md
          title=$(head -n 1 "docs/releases/release-$RELEASE_TAG.md" | sed 's/^# *//; s/ — / · /')
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --notes-file build/release-notes.md build/release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
