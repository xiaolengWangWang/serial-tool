name: Sync GitHub release to Gitee
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Gitee release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (!$env:GITEE_TOKEN) { throw 'Missing GITEE_TOKEN secret' }
          ./scripts/publish-gitee.ps1 -Tag $env:RELEASE_TAG -PrepareOnly
  upload:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload release assets
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASSET_SHARD: ${{ matrix.shard }}
        run: ./scripts/publish-gitee.ps1 -Tag $env:RELEASE_TAG -SkipCodePush -ShardIndex ([int]$env:ASSET_SHARD) -ShardCount 4
  verify:
    needs: upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Gitee release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/publish-gitee.ps1 -Tag $env:RELEASE_TAG -SkipCodePush -VerifyOnly
